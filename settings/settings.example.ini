; Copy to settings.ini in the working directory, or set PAIN_SETTINGS_PATH.
; Uncomment the values to override the equivalent environment variables.
[settings]
; vsync = on
; frame_cap = 0
; fullscreen = off
; window_size = auto
; fullscreen_size = auto
; Fullscreen sizes are drawable pixels on Metal and exact modes when available on Vulkan.
; aspect = fit
; language = auto
; audio = on

; Metal register-file renderer
; post_scale = 100
; Percentage of scanout size for post-processing. Geometry remains at guest resolution.
; aa = off
; vibrance = 0
; contrast = 1
; sharpen = 0
; anisotropic = 0
; res_scale = 1
; Internal resolution as a multiple of the guest's (0.5 to 3, startup only). 2 renders at 2560x1440.
; upscale = off
; off or metalfx (startup only). MetalFX spatial scaling of the presented image up to the window.
; metal_headless = off
; metal_guest_programs = on

; Vulkan renderer
; vulkan_window = off
; vulkan_guest_programs = off

; Optional guarded lift
; unlock_trainer = off

; Crash Course pose workaround (startup only)
; pin_pose_at_kick = on

; Startup thread order (startup only). Off can stall the boot before the install gate.
; creator_first = on

; RSX FIFO park grace in milliseconds (startup only). Low values can stall the game when the host is busy.
; fifo_park_grace_ms = 2000

; Synthesized vblank period in milliseconds, fractions allowed (startup only). PAIN waits two
; vblanks per frame: 16.667 is the console's 30 FPS, 8.333 caps at 60 FPS.
; vblank_ms = 8

; Simulation steps per rendered frame, 1 or 2 (startup only). 2 is the game's own driver and
; plays at normal speed at 30 FPS. 1 plays at normal speed at 60 FPS: pair it with vblank_ms = 8.333.
; sim_steps = 2

; macOS: keep the heavy threads on performance cores (on or off, startup only).
; thread_qos = on

; macOS: cache SPU memory-flow controller lookups (startup only).
; spu_mfc_lookup_cache = off

; Host threads for the geometry (ICE Mesh) jobs, 1 to 6 (startup only). The game uses 2.
; mesh_lanes = 2
